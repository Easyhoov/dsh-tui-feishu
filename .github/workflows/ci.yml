name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (build + manifest + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # validate-manifest.mjs resolves the Community v0.15 schema from a
      # sibling `dsh-ecosystem-spec` checkout (two levels above the repo);
      # vendor/dsh-std is a submodule pinning the manifest schema.
      - name: Fetch dsh-ecosystem-spec (schema + registries)
        run: |
          git clone --depth 1 https://github.com/T-Auto/dsh-ecosystem-spec.git "${{ github.workspace }}/../../dsh-ecosystem-spec"
          git -C "${{ github.workspace }}/../../dsh-ecosystem-spec" submodule update --init --depth 1 vendor/dsh-std

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      # lib/ is committed (npm pack files whitelist): fail the build when the
      # checked-in output drifted from src/, so a forgotten rebuild can never
      # ship a package that disagrees with its sources.
      - name: Guard lib/ drift (committed build output matches src)
        run: git diff --exit-code lib/

      - name: Validate plugin manifest
        run: npm run validate:manifest

      - name: Run tests
        run: npm test
